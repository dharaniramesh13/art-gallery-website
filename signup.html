<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up | Kalakriti Gallery</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/auth.css">
</head>

<body data-page="signup">
<a class="skip" href="#form">Skip to the form</a>

<header class="nav">
  <a class="brand" href="index.html" id="brandName">Kalakriti</a>
  <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="navLinks" aria-label="Open menu"><span></span></button>
  <nav class="nav-links" id="navLinks" aria-label="Main">
    <a href="index.html#gallery">Collection</a>
    <a href="index.html#about">About</a>
    <a href="index.html#exhibitions">Exhibitions</a>
    <a href="index.html#contact">Contact</a>
    <div class="auth-links" id="authLinks"></div>
  </nav>
</header>

<main class="auth">
  <figure class="auth-art" aria-hidden="true">
    <img id="authArt" alt="">
    <figcaption><em>Neon Monsoon</em>Anita Rao, pigment print (sample artwork)</figcaption>
  </figure>

  <section class="auth-panel" aria-labelledby="authTitle">
    <div class="auth-card">
      <h1 id="authTitle">Create an account</h1>
      <p>Sign up to put your own artwork in the gallery.</p>

      <form id="form" novalidate>
        <div class="form-alert" id="formAlert" role="alert" hidden></div>

        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" name="name" autocomplete="name" required aria-describedby="nameErr">
          <span class="error" id="nameErr"></span>
        </div>

        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" autocomplete="email" required aria-describedby="emailErr">
          <span class="error" id="emailErr"></span>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="pw-wrap">
            <input type="password" id="password" name="password" autocomplete="new-password" required aria-describedby="passwordErr pwHint">
            <button class="pw-toggle" type="button" data-target="password" aria-label="Show password">Show</button>
          </div>
          <span class="hint" id="pwHint">Use 8 or more characters with at least one letter and one number.</span>
          <span class="error" id="passwordErr"></span>
        </div>

        <div class="field">
          <label for="confirm">Confirm password</label>
          <div class="pw-wrap">
            <input type="password" id="confirm" name="confirm" autocomplete="new-password" required aria-describedby="confirmErr">
            <button class="pw-toggle" type="button" data-target="confirm" aria-label="Show password">Show</button>
          </div>
          <span class="error" id="confirmErr"></span>
        </div>

        <button class="btn primary auth-submit" id="submitBtn" type="submit">Create account</button>
      </form>

      <p class="auth-alt">Already have an account? <a href="login.html" id="altLink">Log in</a></p>
    </div>
  </section>
</main>

<div class="sr-only" id="announcer" aria-live="polite"></div>
<noscript><p style="padding:24px">This page needs JavaScript to work.</p></noscript>

<script src="js/config.js"></script>
<script src="js/artworks-data.js"></script>
<script src="js/utils.js"></script>
<script src="js/placeholder-art.js"></script>
<script src="js/storage.js"></script>
<script src="js/nav.js"></script>
<script src="js/auth.js"></script>
</body>
</html>

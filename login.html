<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in | Kalakriti Gallery</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/auth.css">
</head>

<body data-page="login">
<a class="skip" href="#form">Skip to the form</a>

<header class="nav">
  <a class="brand" href="index.html" id="brandName">Kalakriti</a>
  <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="navLinks" aria-label="Open menu"><span></span></button>
  <nav class="nav-links" id="navLinks" aria-label="Main">
    <a href="index.html#gallery">Collection</a>
    <a href="index.html#about">About</a>
    <a href="index.html#exhibitions">Exhibitions</a>
    <a href="index.html#contact">Contact</a>
    <div class="auth-links" id="authLinks"></div>
  </nav>
</header>

<main class="auth">
  <figure class="auth-art" aria-hidden="true">
    <img id="authArt" alt="">
    <figcaption><em>Dusk at the Barrage</em>Ravi Kumar, oil on canvas (sample artwork)</figcaption>
  </figure>

  <section class="auth-panel" aria-labelledby="authTitle">
    <div class="auth-card">
      <h1 id="authTitle">Log in</h1>
      <p>Welcome back. Log in to add, replace or remove artworks.</p>

      <form id="form" novalidate>
        <div class="form-alert" id="formAlert" role="alert" hidden></div>

        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" autocomplete="email" required aria-describedby="emailErr">
          <span class="error" id="emailErr"></span>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="pw-wrap">
            <input type="password" id="password" name="password" autocomplete="current-password" required aria-describedby="passwordErr">
            <button class="pw-toggle" type="button" data-target="password" aria-label="Show password">Show</button>
          </div>
          <span class="error" id="passwordErr"></span>
        </div>

        <div class="check">
          <input type="checkbox" id="remember" name="remember" checked>
          <label for="remember">Keep me logged in on this device</label>
        </div>

        <button class="btn primary auth-submit" id="submitBtn" type="submit">Log in</button>
      </form>

      <p class="auth-alt">New here? <a href="signup.html" id="altLink">Create an account</a></p>
    </div>
  </section>
</main>

<div class="sr-only" id="announcer" aria-live="polite"></div>
<noscript><p style="padding:24px">This page needs JavaScript to work.</p></noscript>

<script src="js/config.js"></script>
<script src="js/artworks-data.js"></script>
<script src="js/utils.js"></script>
<script src="js/placeholder-art.js"></script>
<script src="js/storage.js"></script>
<script src="js/nav.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
